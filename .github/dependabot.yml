version: 2
# Di norma una sola PR a settimana per ecosistema (gruppi con tutti i salti di
# versione). Senza applies-to i gruppi valgono solo per gli aggiornamenti di
# versione: gli avvisi di sicurezza restano PR separate e immediate.
# cooldown: si propongono solo versioni pubblicate da almeno 7 giorni, per non
# installare un pacchetto compromesso nelle ore prima che venga ritirato.
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      pub:
        patterns: ['*']
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns: ['*']
